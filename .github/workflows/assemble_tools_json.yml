name: Assemble tools.json

on:
  push:
    branches: [ 'master', 'main' ]
    paths:
      - "tools/*"
      - ".github/workflows/assemble_tools_json.yml"
  workflow_dispatch:

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: assemble tools.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # see  https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        # see  https://github.com/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: assemble tools.json
        run: helpers/tools-assemble.py
      - name: Upload artifact
        # see  https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools.json
          path: tools.json

  validate:
    needs:
      - assemble
    name: validate tools.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        # see https://github.com/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Install check-jsonschema
        run: pip install check-jsonschema
      - name: Download artifact
        # see https://github.com/actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools.json
      - name: Validate tools.json
        run: check-jsonschema --schemafile schemas/tools.schema.json tools.json

  push-back:
    needs:
      - assemble
      - validate
    name: push tools.json
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for git push
    steps:
      - name: Checkout repository
        # see  https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Download artifact
        # see  https://github.com/actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools.json
      - name: diff
        run: git diff tools.json
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Commit tools.json
        run: |
          git add tools.json
          git commit -s -m "Update tools.json [automated commit]" || echo "No changes to commit"
      - name: git push back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

  publish:
    name: deploy
    needs:
      - push-back
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Deploy Hook
        run: curl -X POST '${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}'

