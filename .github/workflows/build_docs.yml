name: Build Docs

on:
  push:
    branches: ['master', 'main']
    paths:
      - "schemas/*"
      - ".github/workflows/build_docs.yml"
  workflow_dispatch:

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs_json:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    defaults:
      run:
        working-directory: docgen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        # setup-python cannot install on the self-hosted Amazon Linux pool; uv
        # can, and activate-environment puts a venv's python and uv pip on PATH.
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true

      # A uv venv has no pip, so gen.sh's own `python -m pip` fallback would
      # fail; installing here means it finds generate-schema-doc and skips it.
      - name: Install docgen requirements
        run: uv pip install -r requirements.txt

      - name: Generate Schema documentation
        run: ./gen.sh

      # Upload docs so the deploy job can pick them up
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docgen/docs  # The folder that has your generated docs

  deploy:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    needs: docs_json
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
