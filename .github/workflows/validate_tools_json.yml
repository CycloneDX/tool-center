name: Validate tools.json

on:
  push:
    branches: [ 'master', 'main' ]
    paths:
      - "tools.json"
      - "schemas/tools.schema.json"
      - ".github/workflows/validate_tools_json.yml"
  pull_request:
    branches: [ 'master', 'main' ]
    paths:
      - "tools.json"
      - "schemas/tools.schema.json"
      - ".github/workflows/validate_tools_json.yml"
  workflow_dispatch:

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        # setup-python cannot install on the self-hosted Amazon Linux pool; uv
        # can, and activate-environment puts a venv's python and uv pip on PATH.
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install check-jsonschema
        run: uv pip install check-jsonschema

      - name: Validate tools.json
        run: check-jsonschema --schemafile schemas/tools.schema.json tools.json
