name: Validate each tool

on:
  push:
    branches: [ 'master', 'main' ]
    paths:
      - "tools/*"
      - "schemas/tool.schema.json"
      - ".github/workflows/validate_tools.yml"
  pull_request:
    paths:
      - "tools/*"
      - "schemas/tool.schema.json"
      - ".github/workflows/validate_tools.yml"
  workflow_dispatch:

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate each tool
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        # setup-python cannot install on the self-hosted Amazon Linux pool; uv
        # can, and activate-environment puts a venv's python and uv pip on PATH.
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install check-jsonschema
        run: uv pip install check-jsonschema

      - name: Validate all tools
        run: |
          set -exu
          for tool in tools/*.json
          do
            check-jsonschema --schemafile schemas/tool.schema.json "$tool"
          done
